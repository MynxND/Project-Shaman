<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>พรีวิวชุดอาชีพ — ไม่มีหัว</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#102124;color:#eee5d1}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1200px;margin-inline:auto}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6;color:#c5cfcc}header{margin-bottom:20px}.panel{min-width:0;background:#1b3034;border:1px solid #405052;border-radius:12px;padding:18px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.stage{position:relative;display:grid;place-items:center;aspect-ratio:1;max-height:70vh;min-height:240px;background:repeating-conic-gradient(#56666a 0% 25%,#607175 0% 50%) 0/24px 24px;border-radius:8px;overflow:hidden}.stage img{width:var(--sprite-size,384px);max-width:100%;height:auto;image-rendering:pixelated}.controls{display:grid;gap:14px}label{display:grid;gap:6px}select,button,input{font:inherit;min-width:0;max-width:100%}select,button{border:1px solid #69716a;border-radius:7px;background:#233e42;color:#f6ecd8;padding:10px;min-height:44px}button{cursor:pointer}button:hover{background:#345259}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d5ae64;outline-offset:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;min-width:70px}input[type=range]{width:100%;accent-color:#d5ae64;min-height:32px}#status{font-variant-numeric:tabular-nums;color:#e5c78b;min-height:24px}.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:16px}.thumb{padding:0;min-width:0;background:#3a5054;border:2px solid transparent}.thumb img{width:100%;display:block;image-rendering:pixelated}.thumb[aria-current=true]{border-color:#edc16d}small{color:#b7c6c3}.error{color:#ffb6a9}footer{margin-top:24px}#file{overflow-wrap:anywhere;font-size:12px}@media(max-width:760px){body{padding:14px}main{grid-template-columns:minmax(0,1fr)}.stage{max-height:none;min-height:0}.panel{padding:12px}h1{font-size:22px}.strip{gap:2px}.thumb{min-height:0}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}}
</style>
<header><h1>ชุดล่าสุด 8 อาชีพ · ไม่ต่อหัว</h1><p>ดูไฟล์ PNG เดิมขนาด 128×128 เลือกทิศและท่าทางได้ ภาพมือแยกของไทย/รัสเซียซ้อนตามไฟล์เดิม ไม่มีการเพิ่มหัวหรืออุปกรณ์แยก</p></header>
<main><section class="panel" aria-label="ภาพพรีวิว"><div class="stage"><div style="position:relative;width:var(--sprite-size,384px);max-width:100%;aspect-ratio:1"><img id="sprite" alt="ชุดอาชีพไม่มีหัว" style="position:absolute;inset:0;width:100%"><img id="hands" alt="" style="position:absolute;inset:0;width:100%" hidden></div></div><div class="strip" id="strip" aria-label="เลือกเฟรม"></div></section>
<section class="panel controls" aria-label="ตัวควบคุม">
<label>อาชีพ<select id="outfit"></select></label><label>ทิศ<select id="direction"></select></label>
<label>ท่าทาง<select id="action"><option value="idle">ยืน</option><option value="walk" selected>เดิน</option><option value="attack">โจมตี</option><option value="cast">ร่าย</option></select></label>
<label>ความเร็ว<select id="fps"><option value="4">4 FPS · ช้า</option><option value="8" selected>8 FPS</option><option value="12">12 FPS</option><option value="16">16 FPS</option></select></label>
<div class="buttons wide"><button id="play" aria-pressed="false">เล่น</button><button id="previous" aria-label="เฟรมก่อนหน้า">◀</button><button id="next" aria-label="เฟรมถัดไป">▶</button></div>
<label class="wide">เฟรม<input id="frame" type="range" min="0" max="7" value="0" step="1"></label>
<div id="status" class="wide" role="status"></div>
<label>ขยาย<select id="zoom"><option value="128">1×</option><option value="256">2×</option><option value="384" selected>3×</option><option value="512">4×</option></select></label>
<label>พื้นหลัง<select id="background"><option value="check">ตารางโปร่งใส</option><option value="#183c34">เขียวเข้ม</option><option value="#c9c2b4">สีอ่อน</option><option value="#24262a">เทาเข้ม</option></select></label>
<small class="wide" id="scope"></small><small class="wide" id="file"></small>
</section></main><footer><small>ภาพวนซ้ำสำหรับตรวจงานเท่านั้น ไม่ใช่จังหวะโจมตี/ร่ายจริงของเซิร์ฟเวอร์ · อีก 6 ชุด detail ยังเป็นฉบับตรวจงาน</small></footer>
<script>
'use strict';
const outfits=[['achan','อาจารย์ไสยเวท · ไทย'],['juggernaut','Juggernaut · รัสเซีย'],['santet-detail','Santet · อินโดนีเซีย'],['keris-detail','Keris · อินโดนีเซีย'],['onmyoji-detail','Onmyoji · ญี่ปุ่น'],['miko-detail','Miko · ญี่ปุ่น'],['rune-seer-detail','Rune Seer · นอร์เวย์'],['ullr-hunter-detail','Ullr Hunter · นอร์เวย์']];
const directions=[['south','หน้า · S'],['south-east','เฉียงหน้า–ขวา · SE'],['east','ขวา · E'],['north-east','เฉียงหลัง–ขวา · NE'],['north','หลัง · N'],['north-west','เฉียงหลัง–ซ้าย · NW'],['west','ซ้าย · W'],['south-west','เฉียงหน้า–ซ้าย · SW']];
const $=id=>document.getElementById(id),state={frame:0,playing:false,timer:null,revision:0},cache=new Map();
for(const [v,t]of outfits)$('outfit').add(new Option(t,v));for(const [v,t]of directions)$('direction').add(new Option(t,v));
function count(){return $('action').value==='idle'?1:8}
function url(frame,hands=false){const name=$('direction').value+($('action').value==='idle'?'':'-'+frame)+(hands?'-hands':'')+'.png';return '../../../../apps/client/public/assets/character-v3/class-outfits/'+$('outfit').value+'/'+$('action').value+'/'+name}
function image(url){if(!cache.has(url)){cache.set(url,new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error(url));i.src=url}));}return cache.get(url)}
function stop(){state.playing=false;clearInterval(state.timer);state.timer=null;$('play').textContent='เล่น';$('play').setAttribute('aria-pressed','false')}
async function render(){const rev=++state.revision,src=url(state.frame);$('frame').value=state.frame;$('status').className='wide';$('status').textContent='เฟรม '+(state.frame+1)+' / '+count()+($('action').value==='idle'?' · ภาพนิ่ง':'');$('file').textContent=src;for(const [i,b]of [...$('strip').children].entries())b.setAttribute('aria-current',String(i===state.frame));try{await image(src);if(rev!==state.revision)return;$('sprite').src=src;$('hands').hidden=true;}catch(e){if(rev!==state.revision)return;stop();$('sprite').removeAttribute('src');$('hands').hidden=true;$('status').textContent='โหลดภาพไม่สำเร็จ: '+src;$('status').className='wide error'}}
function selection(){stop();state.frame=0;$('frame').max=count()-1;$('frame').disabled=count()===1;$('play').disabled=count()===1;$('previous').disabled=count()===1;$('next').disabled=count()===1;$('strip').replaceChildren();for(let n=0;n<count();n++){const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label','ดูเฟรม '+(n+1));const i=new Image;i.src=url(n);i.alt='เฟรม '+(n+1);b.append(i);b.onclick=()=>{stop();state.frame=n;render()};$('strip').append(b)}$('scope').textContent=['achan','juggernaut'].includes($('outfit').value)?'ชุดที่เชื่อมกับเกมแล้ว · ภาพตัวเดิมไม่รวมอาวุธแยก':'ชุด detail สำหรับตรวจงาน · มีอาวุธวาดรวมในบางเฟรม';render()}
$('play').onclick=()=>{if(state.playing){stop();return}state.playing=true;$('play').textContent='หยุด';$('play').setAttribute('aria-pressed','true');state.timer=setInterval(()=>{state.frame=(state.frame+1)%count();render()},1000/Number($('fps').value))};
for(const id of ['outfit','direction','action'])$(id).onchange=selection;
$('fps').onchange=()=>{const playing=state.playing;stop();if(playing)$('play').click()};
$('frame').oninput=()=>{stop();state.frame=Number($('frame').value);render()};$('previous').onclick=()=>{stop();state.frame=(state.frame+count()-1)%count();render()};$('next').onclick=()=>{stop();state.frame=(state.frame+1)%count();render()};
$('zoom').onchange=()=>document.documentElement.style.setProperty('--sprite-size',$('zoom').value+'px');$('background').onchange=()=>document.querySelector('.stage').style.background=$('background').value==='check'?'':$('background').value;
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);selection();
</script></html>

<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจจังหวะแขน–ขา · แม่แบบ</title><style>body{margin:24px;background:#17292c;color:#eee2cb;font:16px system-ui}main{display:flex;gap:20px;flex-wrap:wrap}canvas{width:min(384px,calc(100vw - 48px));height:auto;image-rendering:pixelated;background:#65777b}button,select{font:inherit;padding:10px;margin:8px}p{max-width:800px;line-height:1.6}</style><h1>แม่แบบจังหวะแขน–ขา</h1><p>สีน้ำเงินคือแขนและขาข้างใกล้กล้อง สีแดงคือข้างไกล · มือข้างเดียวกับเท้าต้องอยู่คนละด้านของแกนลำตัว · ภาพนี้ยังเป็นฉบับตรวจ ไม่ใช่งานที่อนุมัติแล้ว</p><main><canvas id="actor" width="128" height="128"></canvas><canvas id="guide" width="128" height="128"></canvas></main><button id="play">เล่น</button><button id="prev">ก่อนหน้า</button><button id="next">ถัดไป</button><select id="fps"><option value="5">5 FPS · ตรวจช้า</option><option value="25">25 FPS · ทดลอง</option></select><input id="frame" type="range" min="0" max="19" value="0"><p id="status"></p><script src="master-review-data.js"></script><script>const $=id=>document.getElementById(id);let frame=0,timer=null;const imgs=Array.from({length:20},(_,n)=>{const i=new Image;i.src='achan/east-'+n+'.png';i.onload=()=>{if(n===frame)draw()};return i});function draw(){const a=$('actor').getContext('2d');a.imageSmoothingEnabled=false;a.clearRect(0,0,128,128);if(imgs[frame].complete)a.drawImage(imgs[frame],0,0);const g=$('guide').getContext('2d'),p=window.MASTER_PHASES.phases[frame];g.clearRect(0,0,128,128);g.strokeStyle='#ddd';g.beginPath();g.moveTo(62,48);g.lineTo(62,82);g.stroke();for(const side of ['far','near']){const l=p[side];g.strokeStyle=side==='near'?'#45c8de':'#fa8091';g.lineWidth=2;g.beginPath();g.moveTo(62,58);g.lineTo(l.elbow.x,l.elbow.y);g.lineTo(l.wrist.x,l.wrist.y);g.moveTo(62,82);g.lineTo(l.knee.x,l.knee.y);g.lineTo(l.foot.x,l.foot.y);g.lineTo(l.foot.x+5,l.foot.y);g.stroke()}$('frame').value=frame;$('status').textContent='เฟรม '+frame+' / 19 · ใกล้: เท้า X='+p.near.foot.x.toFixed(1)+' มือ X='+p.near.wrist.x.toFixed(1)}function stop(){clearInterval(timer);timer=null;$('play').textContent='เล่น'}$('play').onclick=()=>{if(timer){stop();return}timer=setInterval(()=>{frame=(frame+1)%20;draw()},1000/Number($('fps').value));$('play').textContent='หยุด'};$('prev').onclick=()=>{stop();frame=(frame+19)%20;draw()};$('next').onclick=()=>{stop();frame=(frame+1)%20;draw()};$('frame').oninput=()=>{stop();frame=Number($('frame').value);draw()};$('fps').onchange=stop;window.addEventListener('pagehide',stop);draw();</script></html>

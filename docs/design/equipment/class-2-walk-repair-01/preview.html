<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Santet — แก้จังหวะก้าว 8 ทิศ</title><style>body{background:#182d28;color:#eee4c9;font:17px system-ui;padding:20px}section{display:flex;gap:20px;flex-wrap:wrap}canvas{width:min(44vw,512px);image-rendering:pixelated;background:#243a34}button,input,select{font:inherit}a{color:#e1c477}</style><h1>Santet — แก้ภาพขา 8 ทิศ</h1><p>ต้นฉบับเทียบกับฉบับแก้เฉพาะช่วงขา · ช่วงบน จุดคอ และค่าหัวเดิมคงไว้ · ทิศหน้าอนุมัติแล้ว ทิศอื่นรอตรวจภาพ</p><label>ทิศ <select id="direction"><option>south</option><option>south-east</option><option>east</option><option>north-east</option><option>north</option><option>north-west</option><option>west</option><option>south-west</option></select></label> <button id="play">หยุด</button> <input id="frame" type="range" min="0" max="7" value="0"><span id="label"></span><p id="status"></p><section><div><p>เดิม</p><canvas id="before" width="128" height="128"></canvas></div><div><p>แก้ขา</p><canvas id="after" width="128" height="128"></canvas></div></section><p><a href="/head-walk-audit">ตรวจชุดอื่น</a> · <a href="/head-editor">กลับจัดหัว</a></p><script>
let images=[[],[]],frame=0,playing=true,last=0,serial=0;const slider=document.getElementById('frame');
async function load(){const run=++serial,d=document.getElementById('direction').value,next=[[],[]];images=[[],[]];document.getElementById('status').textContent='กำลังโหลด '+d;try{for(let i=0;i<8;i++)for(let v=0;v<2;v++){const im=new Image();im.src=v?'/head-repair-frame/'+d+'/'+i:'/santet/walk/'+d+'-'+i+'.png';await im.decode();next[v][i]=im;}if(run!==serial)return;images=next;frame=0;document.getElementById('status').textContent=d==='south'?'south · ทิศหน้าอนุมัติแล้ว':d+' · พร้อมตรวจ · ยังไม่เผยแพร่ในเกม';draw();}catch(e){if(run===serial)document.getElementById('status').textContent=d+' · ยังไม่พร้อม';}}
function draw(){if(images[0].length!==8)return;for(const [v,id]of ['before','after'].entries()){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,128,128);c.drawImage(images[v][frame],0,0);}slider.value=frame;const simple=['north','north-east','south-west'].includes(document.getElementById('direction').value);document.getElementById('label').textContent=' เฟรม '+frame+(simple?' · '+['ก้าวซ้าย','ก้าวซ้าย','กลาง','กลาง','ก้าวขวา','ก้าวขวา','กลาง','กลาง'][frame]:'');}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'หยุด':'เล่น';};slider.oninput=()=>{playing=false;document.getElementById('play').textContent='เล่น';frame=Number(slider.value);draw();};
document.getElementById('direction').onchange=load;
function tick(t){if(playing&&images[0].length===8&&t-last>166){last=t;frame=(frame+1)%8;draw();}requestAnimationFrame(tick);}load();requestAnimationFrame(tick);
</script>

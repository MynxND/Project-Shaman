<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Book Art</title>
<style>
  :root { --bg: #1b130d; --panel: #2a1b12; --gold: #c9a24e; --text: #f1dfb0; --muted: #b8a074; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: 'Noto Sans Thai', Tahoma, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; } p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  section { margin-bottom: 18px; padding: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--gold); border-radius: 4px; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figure img { image-rendering: pixelated; display: block; margin: 0 auto 4px; background: repeating-conic-gradient(#3a2a1e 0 25%, #30221a 0 50%) 0 0 / 16px 16px; }
  figcaption { font-size: 12px; color: var(--muted); }
  .banner img { width: min(768px, 100%); height: auto; }
</style></head>
<body>
<h1>Skill Book v1: PixelLab review sheet</h1>
<p>13 images · create_image_pro_flash · charged 86 generations (2026-10-12). Pixel art is scaled up with nearest-neighbour, the same way it appears in the game.</p>
<section><h2>Night banners (256×96, shown ×3)</h2>
  <div class="grid">
    <figure class="banner"><img src="../../../apps/client/public/assets/ui/skill-book/banner-th.png" alt=""><figcaption>ไทย · banner-th · 9</figcaption></figure>
    <figure class="banner"><img src="../../../apps/client/public/assets/ui/skill-book/banner-id.png" alt=""><figcaption>อินโดนีเซีย · banner-id · 9</figcaption></figure>
    <figure class="banner"><img src="../../../apps/client/public/assets/ui/skill-book/banner-ru.png" alt=""><figcaption>รัสเซีย · banner-ru · 9</figcaption></figure>
    <figure class="banner"><img src="../../../apps/client/public/assets/ui/skill-book/banner-jp.png" alt=""><figcaption>ญี่ปุ่น · banner-jp · 9</figcaption></figure>
    <figure class="banner"><img src="../../../apps/client/public/assets/ui/skill-book/banner-no.png" alt=""><figcaption>นอร์เวย์ · banner-no · 9</figcaption></figure>
  </div></section>
<section><h2>Frame decoration</h2>
  <div class="grid">
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/badge-skull.png" width="256" height="256" alt=""><figcaption>ป้ายหัวกะโหลก · 128×128 · 6</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/altar-candles.png" width="192" height="192" alt=""><figcaption>เทียนและแท่นบูชา · 96×96 · 5</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/talisman-strip.png" width="64" height="192" alt=""><figcaption>ยันต์ห้อย · 32×96 · 5</figcaption></figure>
  </div></section>
<section><h2>Category icons (48×48, shown ×2)</h2>
  <div class="grid">
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/cat-all.png" width="96" height="96" alt=""><figcaption>ทั้งหมด · 5</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/cat-attack.png" width="96" height="96" alt=""><figcaption>โจมตี · 5</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/cat-support.png" width="96" height="96" alt=""><figcaption>สนับสนุน · 5</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/cat-passive.png" width="96" height="96" alt=""><figcaption>พาสซีฟ · 5</figcaption></figure>
    <figure><img src="../../../apps/client/public/assets/ui/skill-book/cat-ready.png" width="96" height="96" alt=""><figcaption>เรียนได้ตอนนี้ · 5</figcaption></figure>
  </div></section>
</body></html>

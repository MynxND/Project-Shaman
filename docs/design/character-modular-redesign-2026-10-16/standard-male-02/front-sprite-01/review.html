<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ตัวละครมาตรฐาน — แยกเลเยอร์</title><style>body{background:#192a2d;color:#e4ddcc;font:16px system-ui;margin:24px}main{display:flex;flex-wrap:wrap;gap:24px}.sprite{position:relative;width:min(384px,calc(100vw - 48px));aspect-ratio:1;background:repeating-conic-gradient(#526367 0% 25%,#607175 0% 50%) 0/24px 24px}.sprite img{position:absolute;width:100%;height:100%;image-rendering:pixelated}label{display:inline-block;margin:12px}button{padding:8px}p{max-width:720px}</style><h1>ตัวละครหน้าตรง 128×128</h1><p>ซ้าย: Sprite มาตรฐาน ขวา: ประกอบจากเลเยอร์ เปิด–ปิดชิ้นส่วนได้ ภาพขยาย 3 เท่าโดยไม่เบลอ</p><main><div class="sprite"><img src="front.png" alt="Sprite มาตรฐาน"></div><div class="sprite" id="stack"></div></main><div id="controls"></div><p>ผลตรวจประกอบภาพเดิม: แตกต่าง 0 ไบต์ RGBA ฐานส่วนที่ถูกผมบังเติมด้วย ImageGen แยกจากพิกเซลเดิม และยังต้องตรวจเมื่อใช้กับทรงผมใหม่ ไม่มีการเปลี่ยนตัวในเกม</p><script>for(const [id,name]of [['body','ตัว'],['head','ฐานหัว'],['face','หน้า'],['hair','ผม']]){const img=new Image;img.src=id+'.png';img.alt=name;document.querySelector('#stack').append(img);const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;input.onchange=()=>img.hidden=!input.checked;label.append(input,name);document.querySelector('#controls').append(label)}</script></html>

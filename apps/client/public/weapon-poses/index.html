<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ท่าถืออาวุธ · 8 อาชีพ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102523;color:#efdfb8;font:16px system-ui,sans-serif;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#bcc9bd;line-height:1.6}section{display:flex;flex-wrap:wrap;gap:16px;padding:18px;background:#1b3330;border:1px solid #736043;border-radius:12px}label{display:grid;gap:7px;flex:1;min-width:150px}select,button{font:inherit;color:#efdfb8;background:#112724;border:1px solid #927849;border-radius:7px;padding:10px;min-height:44px}button{cursor:pointer}iframe{display:block;width:100%;height:min(65vh,600px);min-height:340px;border:1px solid #736043;border-radius:12px;margin-top:18px;background:#263b35}small{display:block;margin-top:12px;color:#bcc9bd}@media(max-width:600px){body{padding:12px}h1{font-size:20px}section{padding:12px;gap:12px}iframe{height:48vh}}</style>
<main><h1>ท่าถืออาวุธ · 8 อาชีพ</h1><p>หน้าตรงเป็นค่าเริ่มต้น สำหรับอ้างอิงสร้างท่าใหม่ · ใช้ชุดประจำคลาสและอาวุธเดิมในระบบ</p><section>
<label>อาชีพ<select id="job"><option value="axe-juggernaut">Juggernaut · ขวานและโล่</option><option value="bow-ullr">Ullr Hunter · ธนู</option><option value="gohei-miko">Miko · ไม้โกเฮ</option><option value="fan-onmyoji">Onmyoji · พัด</option><option value="staff-rune-seer">Rune Seer · คทารูน</option><option value="staff-achan">Achan · คทา</option><option value="wand-santet">Santet · ไม้เวท</option><option value="keris">Keris · กริชคู่</option></select></label>
<label>ท่า<select id="motion"><option value="idle">ถืออาวุธ · ยืนนิ่ง</option><option value="attack">โจมตี</option><option value="cast">ร่าย</option></select></label>
<label>ทิศ<select id="facing"><option value="south">หน้าตรง</option><option value="south-east">หน้าขวา</option><option value="east">ขวา</option><option value="north-east">หลังขวา</option><option value="north">หลัง</option><option value="north-west">หลังซ้าย</option><option value="west">ซ้าย</option><option value="south-west">หน้าซ้าย</option></select></label>
<label>การเล่น<select id="frame"><option value="">เล่นวน</option></select></label>
</section><iframe id="view" title="ตัวอย่างท่าถืออาวุธจริง" allow="autoplay"></iframe><small>เลือกเฟรมเพื่อหยุดดูรายละเอียด · พรีวิวสำหรับโหมดพัฒนา ไม่เชื่อมบัญชีและไม่ใช้เครดิต</small></main>
<script>
const job=document.querySelector('#job'),motion=document.querySelector('#motion'),facing=document.querySelector('#facing'),frame=document.querySelector('#frame'),view=document.querySelector('#view');
function frames(){frame.replaceChildren(new Option('เล่นวน',''));const count=motion.value==='cast'?12:motion.value==='attack'?8:0;for(let i=0;i<count;i++)frame.add(new Option('หยุดที่เฟรม '+(i+1),String(i)));frame.disabled=count===0}
function render(){const q=new URLSearchParams({carryReview:'1',solo:'1',outfit:'1',outfitDraft:'1',outfitBaked:'1',outfitDetail:'1',autohead:'0',weapon:job.value,motion:motion.value,facing:facing.value});if(frame.value!=='')q.set('frame',frame.value);view.src='/?'+q;}
job.onchange=facing.onchange=frame.onchange=render;motion.onchange=()=>{frames();render()};frames();render();
</script></html>

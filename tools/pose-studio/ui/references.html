<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ภาพอ้างอิง 8 ทิศ — Pose Studio</title><style>body{margin:0;background:#182d28;color:#eee4c9;font:17px system-ui;padding:24px}h1{color:#d5bc7c}section{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:8px}figure{margin:0;background:#243a34;border:1px solid #466153;padding:8px;text-align:center}img{width:100%;image-rendering:pixelated}figcaption{font-size:13px}a{color:#e1c477}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){body{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>ภาพยืนอ้างอิง 8 ทิศ — ทุกคลาสใน Pose Studio</h1><p>6 คลาสชาย · 48 ภาพเดิมพร้อมชุดและอาวุธ · หน้านี้แสดงภาพเท่านั้น ไม่เรียก GPU</p><p>ไทยและรัสเซียอยู่ในชุดเผยแพร่เดิม ยังไม่ได้เพิ่มในทะเบียน Pose Studio นี้</p><main id="gallery"></main><p><a href="/">กลับ Pose Studio</a></p><script>
const dirs=['south','south-east','east','north-east','north','north-west','west','south-west'];
const names={santet:'อินโดนีเซีย — Santet',keris:'อินโดนีเซีย — Keris',onmyoji:'ญี่ปุ่น — Onmyoji',miko:'ญี่ปุ่น — Miko ชาย','rune-seer':'นอร์เวย์ — Rune Seer','ullr-hunter':'นอร์เวย์ — Ullr Hunter'};
for(const [id,name]of Object.entries(names)){const section=document.createElement('section'),title=document.createElement('h2'),grid=document.createElement('div');title.textContent=name;grid.className='grid';for(const d of dirs){const f=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src='/idle/'+id+'/'+d+'.png';img.alt=name+' '+d;caption.textContent=d;f.append(img,caption);grid.append(f);}section.append(title,grid);document.getElementById('gallery').append(section);}
</script></html>
